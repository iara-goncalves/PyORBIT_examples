common:
  planets:
    b:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [1.3, 100.0]
        K: [0.001, 10.0]
        e: [0.00, 0.70]
      priors:
        e: ['Gaussian', 0.00, 0.098]
    c:
      orbit: keplerian
      parametrization: Eastman2013
      boundaries:
        P: [1.3, 100.0]
        K: [0.001, 10.0]
        e: [0.00, 0.70]
      priors:
        e: ['Gaussian', 0.00, 0.098]
  activity:
    boundaries:
      Prot: [20.0, 35.0]
      Pdec: [10.0, 1000.0]
      Oamp: [0.01, 1.0]
    priors:
      Prot: ['Gaussian', 28.00, 0.50]
      Oamp: ['Gaussian', 0.35, 0.035]
  star:
    star_parameters:
      priors:
        mass: ['Gaussian', 1, 0.000001]
        radius: ['Gaussian', 1, 0.000001]
        density: ['Gaussian', 1, 0.000001]

models:
  radial_velocities:
    planets:
      - b
      - c
  gp_multidimensional:
    model: spleaf_multidimensional_esp
    common: activity
    n_harmonics: 4
    hyperparameters_condition: True
    rotation_decay_condition: True
    HD102365_ESPRESSO_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    HD102365_HARPS-Post_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    HD102365_HARPS-Pre_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    HD102365_HIRES-Post_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    HD102365_PFS-Post_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    HD102365_PFS-Pre_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-20.0, 20.0]
      derivative: True
    HD102365_UCLES_RV:
      boundaries:
        rot_amp: [0.0, 10.0]
        con_amp: [-30.0, 20.0]
      derivative: True
    HD102365_ESPRESSO_BIS:
      boundaries:
        rot_amp: [-80.0, 80.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_ESPRESSO_FWHM:
      boundaries:
        rot_amp: [-50.0, 50.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_HARPS-Post_SHK:
      boundaries:
        rot_amp: [-1.0, 1.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_HARPS-Pre_SHK:
      boundaries:
        rot_amp: [-1.0, 1.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_HIRES-Post_SHK:
      boundaries:
        rot_amp: [-1.0, 1.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_PFS-Post_SHK:
      boundaries:
        rot_amp: [-1.0, 1.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_PFS-Pre_SHK:
      boundaries:
        rot_amp: [-1.0, 1.0]
        con_amp: [-10.0, 10.0]
      derivative: True
    HD102365_UCLES_EWHa:
      boundaries:
        rot_amp: [-1.0, 1.0]
        con_amp: [-10.0, 10.0]
      derivative: True

parameters:
  Tref: 2450830.213590 # earliest date from UCLES
  low_ram_plot: True
  plot_split_threshold: 1000
  cpu_threads: 16

solver:
  pyde:
    ngen: 50000
    npop_mult: 4
  emcee:
    npop_mult: 6
    nsteps: 50000
    nburn: 15000
    nsave: 15000
    thin: 15
  nested_sampling:
    nlive: 2000
    sampling_efficiency: 0.10
    bound: 'multi'
    sample: 'rwalk'
    walks: 50
    maxiter: null
    maxcall: null
    dlogz: 0.01
    enlarge: 1.5
    bootstrap: 0
  recenter_bounds: True
